<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chad">
<meta name="application-name" content="Chad">
<meta name="theme-color" content="#0b0d10">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="A simple daily tracker.">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<script>
// A personal setup link opened in iPhone Safari skips the manifest, so Add to Home Screen keeps the full link.
(function(){var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(ios&&!navigator.standalone&&/^#setup=/.test(location.hash))return;var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);})();
</script>
<link rel="stylesheet" href="style.css">
<title>Chad</title>
</head>
<body>
<main id="app" aria-live="polite"><p class="loading">Opening Chad…</p></main>
<nav id="nav" aria-label="Main"></nav>
<div id="sheet"></div>
<div id="install" hidden></div>
<div id="lock" hidden></div>
<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<noscript>Turn on JavaScript to use Chad.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
